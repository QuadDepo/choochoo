<!DOCTYPE html>
<html lang="nl-NL">
<body>
  <main>
    <!-- Day 1: two trips (out + return) -->
    <div class="grouped-container">
      <div class="grouped-container__header">
        <template shadowrootmode="open">dinsdag 2 januari 2024</template>
      </div>
      <div class="flexItems__container">
        <input id="declare-HB-trip1" type="checkbox" />
        <nes-route data-test-id="journeyDeparture">
          <template shadowrootmode="open">
            <time datetime="08:00">08:00</time>
            <span data-test-id="nes-route-location">Amsterdam CS</span>
          </template>
        </nes-route>
        <nes-route data-test-id="journeyArrival">
          <template shadowrootmode="open">
            <time datetime="08:30">08:30</time>
            <span data-test-id="nes-route-location">Utrecht CS</span>
          </template>
        </nes-route>
        <span class="transactionAmount">€&nbsp;5,50</span>
        <div class="flex__item--transactions-carrier"><span>NS</span></div>
      </div>
      <div class="flexItems__container">
        <input id="declare-HB-trip2" type="checkbox" />
        <nes-route data-test-id="journeyDeparture">
          <template shadowrootmode="open">
            <time datetime="17:15">17:15</time>
            <span data-test-id="nes-route-location">Utrecht CS</span>
          </template>
        </nes-route>
        <nes-route data-test-id="journeyArrival">
          <template shadowrootmode="open">
            <time datetime="17:45">17:45</time>
            <span data-test-id="nes-route-location">Amsterdam CS</span>
          </template>
        </nes-route>
        <span class="transactionAmount">€&nbsp;5,50</span>
        <div class="flex__item--transactions-carrier"><span>NS</span></div>
      </div>
    </div>

    <!-- Day 2: one paid trip + one zero-cost transfer -->
    <div class="grouped-container">
      <div class="grouped-container__header">
        <template shadowrootmode="open">vrijdag 5 januari 2024</template>
      </div>
      <div class="flexItems__container">
        <input id="declare-HB-trip3" type="checkbox" />
        <nes-route data-test-id="journeyDeparture">
          <template shadowrootmode="open">
            <time datetime="09:00">09:00</time>
            <span data-test-id="nes-route-location">Amsterdam CS</span>
          </template>
        </nes-route>
        <nes-route data-test-id="journeyArrival">
          <template shadowrootmode="open">
            <time datetime="09:45">09:45</time>
            <span data-test-id="nes-route-location">Rotterdam CS</span>
          </template>
        </nes-route>
        <span class="transactionAmount">€&nbsp;12,30</span>
        <div class="flex__item--transactions-carrier"><span>NS</span></div>
      </div>
      <div class="flexItems__container">
        <input id="declare-HB-trip4" type="checkbox" />
        <nes-route data-test-id="journeyDeparture">
          <template shadowrootmode="open">
            <time datetime="10:00">10:00</time>
            <span data-test-id="nes-route-location">Rotterdam CS</span>
          </template>
        </nes-route>
        <nes-route data-test-id="journeyArrival">
          <template shadowrootmode="open">
            <time datetime="10:05">10:05</time>
            <span data-test-id="nes-route-location">Rotterdam Blaak</span>
          </template>
        </nes-route>
        <span class="transactionAmount">€&nbsp;0,00</span>
        <div class="flex__item--transactions-carrier"><span>NS</span></div>
      </div>
    </div>
  </main>
</body>
</html>
