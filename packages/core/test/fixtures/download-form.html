<!DOCTYPE html>
<html lang="nl-NL">
<body>
  <main>
    <!-- Four trips, one zero-cost -->
    <div class="flexItems__container">
      <input id="declare-HB-trip1" type="checkbox" />
      <span class="transactionAmount">€&nbsp;5,50</span>
    </div>
    <div class="flexItems__container">
      <input id="declare-HB-trip2" type="checkbox" />
      <span class="transactionAmount">€&nbsp;3,20</span>
    </div>
    <div class="flexItems__container">
      <input id="declare-HB-trip3" type="checkbox" />
      <span class="transactionAmount">€&nbsp;0,00</span>
    </div>
    <div class="flexItems__container">
      <input id="declare-HB-trip4" type="checkbox" />
      <span class="transactionAmount">€&nbsp;8,00</span>
    </div>

    <!-- Download mode radios -->
    <div>
      <label>
        <input id="downloadAllTransactions" type="radio" name="mode" />
        Alle transacties
      </label>
      <label>
        <input id="declaraties" type="radio" name="mode" />
        Als declaratie
      </label>
    </div>
  </main>
</body>
</html>
